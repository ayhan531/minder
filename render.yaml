services:
  - type: web
    runtime: python
    name: eminevim-yatirim-web
    buildCommand: python --version && python -m py_compile tools/backend_server.py
    startCommand: python tools/backend_server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: DATA_DIR
        value: /var/data
      - key: PORT
        value: "5002"
      - key: PUBLIC_BASE_URL
        value: "https://eminevimyatirim.com"
      - key: SEED_TEST_USER
        value: "1"
      - key: TEST_USER_TC
        value: "10000000146"
      - key: TEST_USER_PASSWORD
        value: "TestUser123"
      - key: ADMIN_TC
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REQUIRE_LIVE_MARKET_FOR_TRADING
        value: "1"
      - key: ALLOW_PRICE_SIMULATION
        value: "0"
      - key: OFFICIAL_COMPANY_NAME
        value: "Eminevim Yatırım"
      - key: OFFICIAL_EMAIL
        value: "bilgi@eminevimyatirim.com"
      - key: OFFICIAL_PHONE
        value: "0850 303 6000"
    disk:
      name: eminevim-yatirim-data
      mountPath: /var/data
      sizeGB: 1

