<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="zenithTitle zenithDesc">
  <title id="zenithTitle">Zenith Portföy &amp; Menkul Değerler</title>
  <desc id="zenithDesc">Zenith Portföy &amp; Menkul Değerler kurumsal amblemi: Z harfi ve yükselen finansal büyüme vektörü.</desc>
  <defs>
    <linearGradient id="zenithBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#08182b" />
    </linearGradient>
    <linearGradient id="zenithPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f52ba" />
    </linearGradient>
    <linearGradient id="zenithEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="zenithGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="zenithGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Arka Plan Kalkan / Çerçeve -->
  <rect width="120" height="120" rx="28" fill="url(#zenithBg)" />
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Geometrik Izgara Çizgileri / Kurumsal Finans Dokusu -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="2 4" />

  <!-- Dinamik Z ve Yükselen Tepe Monogramı -->
  <g filter="url(#zenithGlow)">
    <!-- Üst Yatay Bar -->
    <path d="M36 38 H82" stroke="url(#zenithPrimary)" stroke-width="8" stroke-linecap="round" />

    <!-- Çapraz Taşıyıcı Gövde -->
    <path d="M78 40 L42 80" stroke="url(#zenithEmerald)" stroke-width="8" stroke-linecap="round" />

    <!-- Alt Yatay Bar -->
    <path d="M38 80 H84" stroke="url(#zenithEmerald)" stroke-width="8" stroke-linecap="round" />

    <!-- Zirve / Büyüme Oku (Zenith Arrow) -->
    <path d="M72 26 L88 26 L88 42" fill="none" stroke="url(#zenithGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="88" cy="26" r="3" fill="#fbbf24" />
  </g>

  <!-- Minik Kurumsal Yıldız / İtibar İşareti -->
  <circle cx="34" cy="80" r="3" fill="#10b981" />
</svg>
